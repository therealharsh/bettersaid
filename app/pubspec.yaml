name: bettersaid
description: Anonymous, Link-Based Fight Mediator
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Navigation
  go_router: ^12.1.3
  
  # UI Components
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  phosphor_flutter: ^2.0.1
  
  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0
  
  # Utilities
  uuid: ^4.2.1
  crypto: ^3.0.3
  qr_flutter: ^4.1.0
  url_launcher: ^6.2.2
  share_plus: ^7.2.2
  
  # Storage
  shared_preferences: ^2.2.2
  
  # JSON
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
